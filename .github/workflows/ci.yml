name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: apothem-ai
      # Sibling checkout so the OpenAPI drift check can compare against the
      # source of truth. Needs a token when apothem-api is private; the check
      # skips itself when the checkout is unavailable.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: rsilvamedeiros/apothem-api
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
          path: apothem-api
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apothem-ai/package-lock.json
      - run: npm ci
        working-directory: apothem-ai
      - run: npm run lint
        working-directory: apothem-ai
      - run: npm run typecheck
        working-directory: apothem-ai
      - run: npm run test:coverage
        working-directory: apothem-ai
      - run: npm run openapi:check
        working-directory: apothem-ai
      - run: npm run web:build
        working-directory: apothem-ai
      - run: npm run site:build
        working-directory: apothem-ai

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
